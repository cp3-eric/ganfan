server:
  port: ${PORT:8080}
spring:
  application:
    name: ganfan-backend
  mvc:
    throw-exception-if-no-handler-found: true
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: jdbc:h2:mem:ganfan;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true
  jackson:
    time-zone: Asia/Shanghai
app:
  cors-origins: ${CORS_ORIGINS:http://127.0.0.1:5173,http://localhost:5173}
  nearby:
    external:
      enabled: ${NEARBY_EXTERNAL_ENABLED:false}
      url: ${NEARBY_EXTERNAL_URL:}
      token: ${NEARBY_EXTERNAL_TOKEN:}
    map:
      # 地图 POI 数据源。开启后需通过环境变量注入各自的 Web 服务 Key。
      # Key 请在服务商开放平台申请后以环境变量传入，不要写入本文件。
      cache-ttl-seconds: ${NEARBY_MAP_CACHE_TTL_SECONDS:300}
      max-concurrent-requests: ${NEARBY_MAP_MAX_CONCURRENT_REQUESTS:4}
      amap:
        enabled: ${AMAP_ENABLED:false}
        key: ${AMAP_WEB_SERVICE_KEY:}
        types: ${AMAP_TYPES:050000}
        keywords: ${AMAP_KEYWORDS:}
        offset: ${AMAP_OFFSET:25}
        endpoint: ${AMAP_ENDPOINT:https://restapi.amap.com/v3/place/around}
      tencent:
        enabled: ${TENCENT_MAP_ENABLED:false}
        key: ${TENCENT_MAP_WEB_SERVICE_KEY:}
        keyword: ${TENCENT_MAP_KEYWORD:餐厅}
        category: ${TENCENT_MAP_CATEGORY:餐饮}
        page-size: ${TENCENT_MAP_PAGE_SIZE:20}
        endpoint: ${TENCENT_MAP_ENDPOINT:https://apis.map.qq.com/ws/place/v1/search}
  jwt:
    # 仅用于本地开发；生产环境必须设置 JWT_SECRET（Base64 编码且至少 32 字节）。
    secret: ${JWT_SECRET:Z2FuZmFuLWRldi1zZWNyZXQtZm9yLWp3dC0yMDI2LXNhcGxl}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:10080}
